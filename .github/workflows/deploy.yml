name: Deploy Arc observation registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARC_RPC_URL: https://rpc.testnet.arc.io
      ARC_PRIVATE_KEY: ${{ secrets.ARC_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run project tests
        run: |
          npm run build
          npm test

      - name: Deploy registry and record live observation
        run: npm run deploy:registry

      - name: Verify contract on ArcScan
        continue-on-error: true
        run: npm run verify:registry

      - name: Publish deployment summary
        if: always()
        run: |
          if [ -f deployment.json ]; then
            echo "## Arc Testnet deployment" >> "$GITHUB_STEP_SUMMARY"
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("deployment.json","utf8")); console.log(`- Contract: [${d.contractAddress}](${d.explorerContractUrl})\n- Deployment tx: [${d.deploymentTxHash}](${d.explorerDeploymentTxUrl})\n- Observation tx: [${d.observationTxHash}](${d.explorerObservationTxUrl})\n- Observed block: ${d.observedBlock}\n- Deployer: ${d.deployer}`)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-deployment-evidence
          path: |
            deployment.json
            standard-input.json
          if-no-files-found: ignore
